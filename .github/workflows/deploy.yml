name: Build Docker image (master)

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/pinnitapp
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, Windows]

    steps:
      - name: Pull latest image and restart container
        shell: pwsh
        env:
          GEOCODE_API_KEY: ${{ secrets.GEOCODE_API_KEY }}
          GEOCODE_API_URL: ${{ secrets.GEOCODE_API_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          $dockerPaths = @('C:\Program Files\Docker\Docker\resources\bin', 'C:\ProgramData\DockerDesktop\version-bin')
          foreach ($p in $dockerPaths) { if (Test-Path $p) { $env:Path = "$p;$env:Path"; break } }
          docker pull ghcr.io/${{ github.repository_owner }}/pinnitapp:latest
          docker stop pinnitapp 2>$null; docker rm pinnitapp 2>$null
          docker run -d --name pinnitapp --restart unless-stopped -e GEOCODE_API_KEY="$env:GEOCODE_API_KEY" -e GEOCODE_API_URL="$env:GEOCODE_API_URL" -e SUPABASE_URL="$env:SUPABASE_URL" -e SUPABASE_ANON_KEY="$env:SUPABASE_ANON_KEY" ghcr.io/${{ github.repository_owner }}/pinnitapp:latest
