# Run PinnitApp Expo dev server with tunnel (Expo Go from anywhere)
# Usage: copy .env.example to .env, fill values, then: docker compose up -d
# On server after CI/CD: use image: ghcr.io/YOUR_ORG/pinnitapp:latest and remove build:
services:
  pinnitapp:
    build: .
    container_name: pinnitapp
    restart: unless-stopped
    environment:
      - GEOCODE_API_KEY=${GEOCODE_API_KEY}
      - GEOCODE_API_URL=${GEOCODE_API_URL:-https://geocode.maps.co/reverse}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    # Optional: use env_file instead of listing vars
    # env_file: .env
